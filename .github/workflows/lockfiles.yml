# 依赖锁文件维护 + 漂移校验（pip-compile）
# ============================================================================
# requirements.in / requirements-full.in = 人写的抽象规格
# requirements.txt / requirements-full.txt = 机器编译的锁文件（钉死版本 + sha256 哈希）
#
# 锁文件保证「今天装、半年后装、别人装」都是同一批字节。
# 必须在 Ubuntu 上编译：pip-compile 解析的是当前平台的依赖图，
# 生成环境必须与 CI 消费环境（ubuntu-latest + Python 3.11）一致。
#
# --strip-extras 说明：--require-hashes 要求每个被安装的包都带哈希出现在文件里；
# 若保留 uvicorn[standard] 这类 extras 写法，pip 会去装 extras 依赖却发现没钉住而报错。
# --strip-extras 把 extras 摊平成独立钉死行，效果等价且满足哈希模式。
#
# requirements-full.txt 含 torch / ultralytics / funasr，依赖树很大，
# 因此单独给这一步更长的超时；它不参与 CI 主流程（CI 只装 requirements.txt）。
#
# ============================ 两个 job 的分工 ============================
#   lock   —— 生成并提交锁文件。只在手动触发 / 每周一定时跑。
#   verify —— 校验漂移：拿规格文件重新编译，和仓库里的锁文件逐字节比，
#             不一致就失败。在 push / PR 且涉及依赖文件时跑。
#
#   为什么要 verify：改了 .in 却忘了刷锁时，CI 仍按「旧锁」安装，
#   全绿、毫无异常 —— 问题被完美掩盖。等别人按 .in 安装才会撞上
#   一个 CI 从未测过的依赖组合。verify 把这种静默漂移变成红叉。
#
#   ⚠️ 使用姿势：改了 .in 之后 verify 会先红一次（设计如此）。
#      到 Actions → Lockfiles → Run workflow 刷新锁文件并提交，verify 随即转绿。
# ============================================================================
name: Lockfiles

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1" # 每周一 02:00 UTC（北京时间 10:00）自动刷新
  push:
    paths:
      - "requirements*.in"
      - "requirements*.txt"
      - ".github/workflows/lockfiles.yml"
  pull_request:
    paths:
      - "requirements*.in"
      - "requirements*.txt"

permissions:
  contents: write

# pip-tools 必须钉住版本：其输出格式会随版本变化，不钉住会让 verify
# 变成随 pip-tools 升级而随机报警的假探针。
env:
  PIP_TOOLS_VERSION: "7.6.2"

jobs:
  lock:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # 必须与 ci.yml 的 python-version 一致

      - name: 安装 pip-tools
        run: |
          python -m pip install --upgrade pip
          pip install "pip-tools==${PIP_TOOLS_VERSION}"
          pip-compile --version

      - name: 编译 requirements.txt（基础依赖，CI 消费）
        run: |
          set -euo pipefail
          pip-compile --generate-hashes --strip-extras \
            --output-file requirements.txt requirements.in
          echo "----- 产物概览 -----"
          grep -c -- '--hash=' requirements.txt | sed 's/^/带哈希的依赖行数: /'

      - name: 编译 requirements-full.txt（含 AI 模型依赖）
        timeout-minutes: 25
        run: |
          set -euo pipefail
          pip-compile --generate-hashes --strip-extras \
            --output-file requirements-full.txt requirements-full.in
          echo "----- 产物概览 -----"
          grep -c -- '--hash=' requirements-full.txt | sed 's/^/带哈希的依赖行数: /'

      - name: 有变化才提交
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "锁文件无变化，跳过提交"
          else
            git commit -m "chore(deps): 刷新 pip-compile 锁文件"
            git push
          fi

  verify:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read # 只读即可：本 job 不提交任何东西
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # 必须与 lock job / ci.yml 一致

      - name: 安装 pip-tools
        run: |
          python -m pip install --upgrade pip
          pip install "pip-tools==${PIP_TOOLS_VERSION}"
          pip-compile --version

      - name: 漂移校验：requirements.txt
        run: |
          set -euo pipefail
          pip-compile --generate-hashes --strip-extras \
            --output-file requirements.txt requirements.in
          if git diff --exit-code -- requirements.txt; then
            echo "✅ requirements.txt 与 requirements.in 同步"
          else
            echo "::error::锁文件已漂移：requirements.txt 与 requirements.in 不同步。"
            echo "::error::修复：到 Actions → Lockfiles → Run workflow 刷新锁文件后提交。"
            exit 1
          fi

      - name: 漂移校验：requirements-full.txt
        timeout-minutes: 25
        run: |
          set -euo pipefail
          pip-compile --generate-hashes --strip-extras \
            --output-file requirements-full.txt requirements-full.in
          if git diff --exit-code -- requirements-full.txt; then
            echo "✅ requirements-full.txt 与 requirements-full.in 同步"
          else
            echo "::error::锁文件已漂移：requirements-full.txt 与 requirements-full.in 不同步。"
            echo "::error::修复：到 Actions → Lockfiles → Run workflow 刷新锁文件后提交。"
            exit 1
          fi
